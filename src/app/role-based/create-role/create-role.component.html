<div class="h-[100vh] w-[100vw] overflow-y-auto overflow-x-hidden">
   
  <p-toast position="top-center"></p-toast>
  <p-blockUI [blocked]="isLoading">
    <!-- <p-progressSpinner 
      styleClass="w-4rem h-4rem" 
      strokeWidth="8" 
      fill="var(--surface-ground)" 
      animationDuration=".5s" /> -->
      <i class='bx bx-loader-circle fa-spin custom-icon fa-spinner'></i>
  </p-blockUI>
  <div>
    <img
    src="Background_image.png"
    alt="Background"
    class=" w-full h-full object-cover -z-10 fixed"
  />
    <app-header></app-header>
</div>
<div class="body d-flex">
   
    <div class="h-[100vh]">
        
        <app-sidebar class="h-[100vh]"></app-sidebar>
    </div>
    <div class="w-[100vw]">

    <div class="flex justify-center">
      <div
        class="flex flex-row w-[100vw] md:w-[65vw] sm:w-[65vw] lg:w-[63vw]  !py-3 !px-5 justify-between"
      >
        <h3 class="font-semibold text-base text-md md:text-xl ">
          Role Based Access Management
        </h3>
        <!-- <button (click)="showDialog()"
          class="bg-customBlue text-white font-semibold py-1 px-2 rounded-lg sm:px-6 sm:py-3 sm:text-base md:px-8 md:py-4 md:text-lg lg:px-2 lg:py-1 lg:text-lg"
        >
          View Role
        </button> -->
      </div>
    </div>
  
    <div class="flex justify-center">
      <div
        class="card w-[80vw] h-auto md:w-[60vw] flex flex-col justify-start p-3 bg-[#FDF5E6] rounded-lg shadow-lg"
      >
        <form action="" [formGroup]="roleForm" class="flex flex-col">
          <label class="font-semibold lg:text-lg" for="rolename">Role Name</label>
  
          <input
            type="text"
            id="rolename"
            formControlName="rolename"
            class="!bg-white !text-sm !rounded-[22px] my-2 !px-2 h-10 md:!w-[20vw]"
            placeholder="Role Name"
            pInputText
          />
          <div *ngIf="rolename?.hasError('required') && rolename?.touched" class="text-red-500">
            Role Name is required.
          </div>
          <span class="my-2 font-semibold lg:text-lg">Associated Business</span>
          <div class="flex flex-row flex-wrap gap-7" formGroupName="checkboxes">
            <div >
              <p-checkbox value="1" inputId="SIMS" formControlName="SIMS" binary="true" />
              <label for="SIMS" class="ml-2">SIMS</label>
            </div>
            <div>
              <p-checkbox value="1" inputId="AUDIT" formControlName="AUDIT" binary="true" />
              <label for="AUDIT" class="ml-2">AUDIT</label>
            </div>
            <div>
              <p-checkbox value="1" inputId="GAINER" formControlName="GAINER" binary="true" />
              <label for="GAINER" class="ml-2">GAINER</label>
            </div>
            <div>
              <p-checkbox value="1" inputId="IT" formControlName="IT" binary="true" />
              <label for="IT" class="ml-2">IT</label>
            </div>
            <div>
              <p-checkbox value="1" inputId="HR" formControlName="HR" binary="true" />
              <label for="HR" class="ml-2">HR</label>
            </div>
            <div>
              <p-checkbox value="1" inputId="OTHERS" formControlName="OTHERS" binary="true" />
              <label for="OTHERS" class="ml-2">OTHERS</label>
            </div>
          </div>
          <div *ngIf="roleForm.get('checkboxes')?.hasError('atLeastOneRequired') && roleForm.get('checkboxes')?.touched" class="text-red-500 mt-1">
            At least one checkbox must be selected!
          </div>
        </form>
       
      </div>
    </div>
  
    <div class="flex justify-center">
      <div
        class="flex flex-row w-[80vw] md:w-[60vw] py-3 md:px-0 justify-between align-items-center">
      
        <!-- <h3 class="font-semibold text-base text-md md:text-xl">Access Settings</h3> -->

          <div class="mb-3">
              <span class="font-semibold text-base text-md md:text-xl ">Access Settings</span>
          </div>
          <div>
            <!-- <i class="pi pi-user cursor-pointer me-3" style="font-size: 1.5rem;font-weight:bold " ></i> -->
            <i class='bx bx-download cursor-pointer me-3' style="font-size: 1.5rem;font-weight:bold " ></i>
            <i class='bx bx-export cursor-pointer' style="font-size: 1.5rem;font-weight:bold" ></i>
            
          </div>
        
      </div>
    </div>
  
    <div class="flex justify-center">
      <div
        class="card w-[80vw] h-auto md:w-[60vw] flex flex-col justify-start p-3 bg-[#FDF5E6] rounded-lg shadow-lg">
        <p-table
        styleClass="p-datatable-striped"
          [scrollHeight]="'280px'"
           [scrollable]="true"
           
          [value]="allModules"
          class="bg-white w-full !rounded-lg border !h-[50vh]  border-gray-200 shadow-md"
        >
          <!-- Table Header -->
          <ng-template  pTemplate="header">
            <tr class="bg-gray-200 text-gray-700 text-sm font-semibold">
              <th class=" text-left">Business Vertical</th>
              <th class=" text-left">Module</th>             
              <th class=" text-left">Sub Module</th>
              <th class=" text-left">View</th>
              <th class=" text-left">Edit</th>
              <th class=" text-left">Add</th>
              <th class=" text-left">Delete/Inactive</th>
              <th class=" text-left">All</th>
            </tr>
          </ng-template>
  
          <!-- Table Body -->
          <ng-template pTemplate="body" let-module>
            <!-- <tr
              class="hover:bg-gray-100 transition duration-300 p-[10px] text-gray-700 text-sm h-14"
            >
            <td class="!p-3 text-left">SIMS</td>
              <td class="!p-3 text-left">{{ customer.module_name }}</td>
              <td></td>
              <td class="!p-3 text-center"> <p-checkbox 
                value="view"/></td>
             
              <td class="!p-3 text-center"> <p-checkbox 
                value="edit"/></td>
              <td class="!p-3 text-center"> <p-checkbox 
                value="add"/></td>
              <td class="!p-3 text-center"> <p-checkbox 
                value="delete"/></td>
                <td class="!p-3 text-center" (change)="toggleSelectAll()"> <p-checkbox 
                  value="all"/></td>
            </tr>
             -->
    
            <!-- Submodule Rows (if any) -->
            <tr *ngFor="let submodule of module.submodules; let i=index" class="hover:bg-gray-100 transition duration-300 p-[10px] text-gray-700 text-sm h-14">
              <td class="!p-3 text-left">{{submodule.businessVerticalName}}</td>
              <td>{{submodule.parentModuleName}}</td>
              <td class="!p-3 text-left">{{ submodule.module_name }}</td>
              <!-- <td class="!p-3 text-left">-</td> -->
              <td class="!p-3 text-center">
                <p-checkbox [(ngModel)]="submodule.view1" binary="true"></p-checkbox>
              </td>
              <td class="!p-3 text-center">
                <p-checkbox [(ngModel)]="submodule.edit1" binary="true" ></p-checkbox>
              </td>
              <td class="!p-3 text-center">
                <p-checkbox [(ngModel)]="submodule.add1" binary="true"></p-checkbox>
              </td>
              <td class="!p-3 text-center">
                <p-checkbox [(ngModel)]="submodule.delete1" binary="true"></p-checkbox>
              </td>
              <td class="!p-3 text-center">
                <p-checkbox [(ngModel)]="submodule.view1" (onChange)="toggleAllForModule(module,$event,i)" binary="true"></p-checkbox>
              </td>
            </tr>
            
            
          </ng-template>
        </p-table>
    
    
    
    </div>
   
    </div>

    <div class="flex justify-center w-full items-center">
      <button (click)="submit()" 
        class="bg-customBlue text-white font-semibold mt-4 py-1 px-2 
        rounded-lg  focus:outline-none focus:ring-2 
         focus:ring-opacity-50 sm:text-base
          md:text-lg lg:text-lg cursor-pointer"
      >
        Add Role 
      </button>
    </div>
  </div>
</div>
</div>
