<p-toast></p-toast>
<p-blockUI [blocked]="isLoading">
  <p-progressSpinner 
      styleClass="w-4rem h-4rem" 
      strokeWidth="8" 
      fill="var(--surface-ground)" 
      animationDuration=".5s" />

</p-blockUI>
<p-table [value]="activeBrands"  styleClass="p-datatable-striped"
[tableStyle]="{'min-width': '30rem'}" [responsive]="true">
    <ng-template pTemplate="header">
      <tr>
        <th>Brand Column</th>
        <th>Sequence</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="caption">
      <tr *ngIf="isDuplicateBrandColumns">
        <td colspan="100%">
          <h3 style="color: red; font-size: 12px;">Duplicate Brand Columns are there</h3>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="2">No data available.</td>
        </tr>
      </ng-template>
    <ng-template pTemplate="body" let-row>
        
      <tr>
        <td>{{ row.brandColumnName }}</td>
        <td>{{ row.sequence }}</td>
      </tr>

    </ng-template>
    
    
  </p-table>
    <div class="d-flex w-full justify-content-end mt-3">
        <p-button type="button" label="Cancel" icon="pi pi-times" class="me-3 text-white" (onClick)="closeDialog({ buttonType: 'Cancel' })" />
    
        <p-button type="button" label="Submit" icon="pi pi-check" (onClick)="onSubmit({ buttonType: 'Submit' })" [disabled]="activeBrands.length === 0 || isDuplicateBrandColumns" class="text-white"/>
    </div>
