<p-toast></p-toast>
<p-blockUI [blocked]="isLoading">
      <i class='bx bx-loader-circle fa-spin custom-icon fa-spinner'></i>
  </p-blockUI>
  <div class="body">
    <img
    src="Background_image.png"
    alt="Background"
    class="w-full h-full object-cover -z-10 fixed"
  />
  <div class="d-flex justify-center align-items-center h-[70vh]">

      <div class="card w-150 h-auto d-flex justify-center align-items-center rounded-lg shadow-lg ">
        <div class="row col-12 gap-3">
            <h2 class="d-flex justify-center">Create your Password</h2>
            <div class="row">

                <div class="d-flex justify-center">
                    <div class="col-2">
                        <label for="username" class="me-5">Email</label>

                    </div>
                    <div class="col-4">
                        <input 
                        type="text" 
                        pInputText 
                        [(ngModel)]="email" 
                        variant="filled" />

                    </div>
                </div>
            </div>
            <div class="row">

                <div class="d-flex justify-center">
                    <div class="col-2">
                        <label for="password" class="me-3">Password</label>
                    </div>
                    <div class="col-4">
                        <input 
                        pInputText 
                        id="password" 
                        variant="filled"
                        aria-describedby="username-help" 
                        [(ngModel)]="password" />

                    </div>
        
                </div>
            </div>
        </div>
       
<!-- <small id="username-help">
    Enter your username to reset your password.
</small> -->
    <button type="submit" class="mt-3" (click)="googleAuth()">Click for Google Authentication</button>
    <div *ngIf="qrCodeUrl" class="d-flex justify-center align-items-center flex-column mt-3">
        <h3>Scan this QR code with Google Authenticator App</h3>
        <img [src]="qrCodeUrl" alt="QR Code">
        <div>
          <input type="text" [(ngModel)]="OTP" name="token" placeholder="Enter OTP" class="p-2 me-4">
          <button (click)="verifyOTP()" class="w-30 h-50 btn verify-btn">Verify OTP</button>
        </div>
      </div>
    <button class="btn-submit my-3">Submit</button>
      </div>
  </div>
</div>
